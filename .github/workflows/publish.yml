name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# `pytest` with no arguments runs the unit suite and only the unit suite,
# deselecting the destructive integration tests via pytest.ini and the marker
# tests/conftest.py derives from the UptimeKumaTestCase base class. This file
# used to carry its own copy of a nine-filename list with a comment instructing
# that it be kept identical to the one in test.yml; there is now nothing to keep
# in step.
#
# An empty collection exits 5, so a misconfigured gate fails the job instead of
# reporting success to `needs:` having run no tests.
jobs:
  # Gate: a PyPI upload cannot be undone and the version number is burned
  # permanently, so tests and a tag/version match are verified before building.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest

      - name: Run unit tests
        run: pytest -v

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "info={}; exec(open('uptime_kuma_api/__version__.py').read(), info); print(info['__version__'])")
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $pkg"
            exit 1
          fi

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      # Last gate before an irreversible upload. Checks the exact tarball that
      # is about to be published, not a rebuild of it: a broad MANIFEST.in
      # pattern would otherwise sweep tests/.env and tests/.backups/** into it,
      # and a published file cannot be withdrawn.
      - name: Check sdist contents
        run: python scripts/check_sdist.py "dist/*.tar.gz"

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
