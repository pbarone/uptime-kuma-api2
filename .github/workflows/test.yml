name: Tests

# Branch pushes get a fast single-version run so feedback does not wait for a PR.
# main, PRs and release tags get the full matrix.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# `pytest` with no arguments runs the unit suite and only the unit suite. The
# destructive integration tests are deselected by pytest.ini, using a marker
# tests/conftest.py derives from the UptimeKumaTestCase base class -- so there is
# no list of test filenames here to drift out of step with publish.yml or the
# docs, and adding a test file needs no change to this workflow.
#
# An empty collection exits 5, so a misconfiguration fails this job rather than
# passing it green having run nothing.
jobs:
  quick:
    name: quick (3.11)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref != 'refs/heads/main' &&
       !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest

      - name: Run unit tests
        run: pytest -v

  full:
    name: full
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    # Pinned: setup-python has no 3.8/3.9 builds for Ubuntu 26.04, which
    # ubuntu-latest now points to. Revisit when 3.8/3.9 support is dropped.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest

      - name: Run unit tests
        run: pytest -v
